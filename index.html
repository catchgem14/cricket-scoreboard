<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cricket Scoreboard</title>
    <meta
      name="description"
      content="Simple cricket scoring app for matches, local score tracking, and quick match updates."
    />
    <meta name="theme-color" content="#0d3652" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-label="Cricket scoreboard logo">C</div>
          <div>
            <p class="eyebrow">Live Match</p>
            <h1>Cricket Scoreboard</h1>
          </div>
        </div>
        <button id="resetBtn" class="outline-btn" type="button">Reset</button>
      </header>

      <div class="hero-banner" aria-label="Match banner">
        <div>
          <span class="badge">Professional scoring</span>
          <h2>Match Center</h2>
        </div>
        <div class="banner-status">
          <span class="status-dot"></span>
          <span>Live Updates</span>
        </div>
      </div>

      <main class="dashboard">
        <section class="panel config-panel">
          <h2>Match Setup</h2>
          <div class="field-grid">
            <label>
              Batting Team
              <input id="battingTeamInput" type="text" value="Team A" maxlength="24" />
            </label>
            <label>
              Bowling Team
              <input id="bowlingTeamInput" type="text" value="Team B" maxlength="24" />
            </label>
            <label>
              Overs
              <input id="oversInput" type="number" min="1" max="50" value="20" />
            </label>
          </div>
          <button id="applySetupBtn" class="primary-btn" type="button">Apply setup</button>
        </section>

        <section class="panel score-panel">
          <div class="teams-row">
            <div>
              <span class="label">Batting</span>
              <h2 id="battingTeamName">Team A</h2>
            </div>
            <div class="versus">vs</div>
            <div>
              <span class="label">Bowling</span>
              <h2 id="bowlingTeamName">Team B</h2>
            </div>
          </div>

          <div class="score-grid">
            <div class="score-card runs-card">
              <span class="card-label">Runs</span>
              <strong id="runsValue">0</strong>
            </div>
            <div class="score-card">
              <span class="card-label">Wickets</span>
              <strong id="wicketsValue">0</strong>
            </div>
            <div class="score-card">
              <span class="card-label">Overs</span>
              <strong id="oversValue">0.0</strong>
            </div>
            <div class="score-card">
              <span class="card-label">Run Rate</span>
              <strong id="runRateValue">0.00</strong>
            </div>
          </div>

          <div class="summary-row">
            <div class="summary-box">
              <span>Target</span>
              <strong id="targetValue">-</strong>
            </div>
            <div class="summary-box">
              <span>Need</span>
              <strong id="requiredValue">-</strong>
            </div>
          </div>
        </section>

        <section class="panel controls-panel">
          <h2>Score update</h2>
          <div class="button-grid">
            <button class="score-btn" data-runs="0" type="button">0</button>
            <button class="score-btn" data-runs="1" type="button">1</button>
            <button class="score-btn" data-runs="2" type="button">2</button>
            <button class="score-btn" data-runs="3" type="button">3</button>
            <button class="score-btn" data-runs="4" type="button">4</button>
            <button class="score-btn" data-runs="6" type="button">6</button>
            <button class="score-btn wide-btn" data-type="wide" type="button">Wide</button>
            <button class="score-btn no-ball-btn" data-type="noball" type="button">No Ball</button>
            <button class="score-btn wicket-btn" data-type="wicket" type="button">Wicket</button>
          </div>

          <div class="utility-row">
            <button id="undoBtn" class="outline-btn" type="button">Undo</button>
          </div>
        </section>

        <section class="panel log-panel">
          <h2>Ball-by-ball</h2>
          <ul id="ballLog" class="ball-log" aria-live="polite"></ul>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
